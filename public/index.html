<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synchronized Stopwatch</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #1a1a2e;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      flex-direction: column;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    #timer {
      font-size: clamp(4rem, 15vw, 10rem);
      font-weight: 300;
      color: #00d4ff;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      margin-bottom: 2rem;
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
    }

    #control-btn {
      background-color: #00d4ff;
      color: #1a1a2e;
      border: none;
      padding: 1rem 3rem;
      font-size: 1.2rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s, transform 0.1s;
    }

    #control-btn:hover:not(:disabled) {
      background-color: #00b8e6;
      transform: translateY(-1px);
    }

    #control-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    #control-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #status {
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: #888;
    }

    #status.is-controller {
      color: #00d4ff;
    }

    #error {
      position: fixed;
      top: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background-color: #ff4444;
      color: #ffffff;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-size: 0.9rem;
      box-shadow: 0 4px 12px rgba(255, 68, 68, 0.3);
      z-index: 100;
      transition: opacity 0.3s;
    }

    #error.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="timer">00:00.00</div>
    <button id="control-btn" disabled>Start</button>
    <div id="status">Verbinde...</div>
  </div>
  <div id="error" class="hidden">Verbindung unterbrochen</div>

  <script>
    // UUID v4 generation
    function generateUUID() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0;
        const v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    // Time format function: MM:SS.ms
    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      const milliseconds = Math.floor((ms % 1000) / 10);
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(milliseconds).padStart(2, '0')}`;
    }

    // Client state
    const clientId = generateUUID();
    let state = {
      running: false,
      startTime: null,
      elapsed: 0,
      isController: false
    };

    // DOM elements
    const timerEl = document.getElementById('timer');
    const controlBtn = document.getElementById('control-btn');
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');

    // Update the displayed time using interpolation
    function updateDisplay() {
      if (state.running && state.startTime) {
        const now = Date.now();
        const displayTime = state.elapsed + (now - state.startTime);
        timerEl.textContent = formatTime(displayTime);
      }
      requestAnimationFrame(updateDisplay);
    }

    // Show error message
    function showError() {
      errorEl.classList.remove('hidden');
    }

    // Hide error message
    function hideError() {
      errorEl.classList.add('hidden');
    }

    // Update UI based on state
    function updateUI() {
      // Update button state
      controlBtn.disabled = !state.isController;
      controlBtn.textContent = state.running ? 'Stop' : 'Start';

      // Update status text
      if (state.isController) {
        statusEl.textContent = 'Du bist der Controller';
        statusEl.classList.add('is-controller');
      } else {
        statusEl.textContent = 'Beobachter';
        statusEl.classList.remove('is-controller');
      }

      // Update displayed time when stopped
      if (!state.running) {
        timerEl.textContent = formatTime(state.elapsed);
      }
    }

    // Poll server state every 500ms
    async function pollState() {
      try {
        const response = await fetch(`/api/state?clientId=${clientId}`);
        if (!response.ok) throw new Error('Server error');
        const data = await response.json();
        state.running = data.running;
        state.startTime = data.startTime;
        state.elapsed = data.elapsed;
        state.isController = data.isController;
        updateUI();
        hideError();
      } catch (error) {
        showError();
        // Keep displaying last known time
      }
    }

    // Handle Start/Stop button click
    async function handleControl() {
      const action = state.running ? 'stop' : 'start';
      try {
        const response = await fetch('/api/control', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ clientId, action })
        });
        if (response.ok) {
          const data = await response.json();
          if (data.success && data.state) {
            state.running = data.state.running;
            state.startTime = data.state.startTime;
            state.elapsed = data.state.elapsed;
            updateUI();
          }
        }
      } catch (error) {
        showError();
      }
    }

    // Event listeners
    controlBtn.addEventListener('click', handleControl);

    // Start polling and animation loop
    pollState();
    setInterval(pollState, 500);
    requestAnimationFrame(updateDisplay);
  </script>
</body>
</html>
