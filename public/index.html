<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kacktimer</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="icon" href="/kacke.webp">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #1a1a2e;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
    }
    .layout-grid {
      display: flex;
      width: 100%;
      max-width: 1800px;
      margin: 0 auto;
      gap: 2rem;
      padding: 2rem;
      min-height: 100vh;
    }
    .sidebar {
      flex: 1;
      background: rgba(255,255,255,0.02);
      border-radius: 12px;
      padding: 1.5rem;
      overflow-y: auto;
      max-height: calc(100vh - 4rem);
      display: flex;
      flex-direction: column;
    }
    .sidebar::-webkit-scrollbar { width: 8px; }
    .sidebar::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 4px; }
    .sidebar::-webkit-scrollbar-thumb { background: rgba(0, 212, 255, 0.3); border-radius: 4px; }
    .main {
      flex: 1.5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    h2 {
      color: #00d4ff;
      margin-bottom: 1.5rem;
      font-size: 1.5rem;
      font-weight: 500;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .total-time-container {
      text-align: center;
      margin-bottom: 2rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    #timer {
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 300;
      color: #00d4ff;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
    }
    .timer-label {
      font-size: 0.9rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    #session-timer {
      font-size: clamp(3rem, 10vw, 7rem);
      font-weight: 300;
      color: #ffaa00;
      font-variant-numeric: tabular-nums;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 15px rgba(255, 170, 0, 0.3);
    }
    .session-timer-label {
      font-size: 1.2rem;
      color: #ffaa00;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 2rem;
      text-align: center;
    }
    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    #control-btn, #cancel-btn {
      border: none;
      padding: 1rem 3rem;
      font-size: 1.2rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s, transform 0.1s;
    }
    #control-btn { background-color: #00d4ff; color: #1a1a2e; }
    #control-btn:hover:not(:disabled) { background-color: #00b8e6; transform: translateY(-1px); }
    #cancel-btn { background-color: #ff4444; color: #ffffff; }
    #cancel-btn:hover:not(:disabled) { background-color: #cc0000; transform: translateY(-1px); }
    #control-btn:active:not(:disabled), #cancel-btn:active:not(:disabled) { transform: translateY(0); }
    #control-btn:disabled, #cancel-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    /* Food Selector */
    .food-selector-container {
      margin-top: 1rem;
      background: rgba(0, 212, 255, 0.05);
      padding: 1rem 1.5rem;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      border: 1px solid rgba(0, 212, 255, 0.2);
    }
    .food-selector-row {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .food-selector-container label { color: #00d4ff; font-weight: 500; }
    .food-selector-container select {
      background: #1a1a2e;
      color: #fff;
      border: 1px solid rgba(0, 212, 255, 0.5);
      padding: 0.5rem;
      border-radius: 4px;
      font-size: 1rem;
      outline: none;
    }
    .food-selector-container select:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Category Manager */
    .category-toggle-btn {
      background: transparent;
      border: 1px solid rgba(0, 212, 255, 0.4);
      color: #00d4ff;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: background 0.2s;
    }
    .category-toggle-btn:hover { background: rgba(0, 212, 255, 0.1); }
    .category-manager {
      background: rgba(0, 212, 255, 0.03);
      border: 1px solid rgba(0, 212, 255, 0.15);
      border-radius: 6px;
      padding: 1rem;
      display: none;
    }
    .category-manager.visible { display: block; }
    .category-manager h3 {
      color: #00d4ff;
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .category-list { list-style: none; margin-bottom: 0.75rem; }
    .category-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .category-item span { flex: 1; font-size: 0.9rem; }
    .category-item input[type="text"] {
      flex: 1;
      background: #1a1a2e;
      color: #fff;
      border: 1px solid rgba(0, 212, 255, 0.5);
      padding: 0.3rem 0.5rem;
      border-radius: 3px;
      font-size: 0.9rem;
    }
    .cat-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      padding: 0.2rem 0.4rem;
      border-radius: 3px;
      transition: background 0.2s;
    }
    .cat-btn.edit { color: #ffaa00; }
    .cat-btn.delete { color: #ff4444; }
    .cat-btn.save { color: #00ff88; }
    .cat-btn:hover { background: rgba(255,255,255,0.1); }
    .category-add {
      display: flex;
      gap: 0.5rem;
    }
    .category-add input {
      flex: 1;
      background: #1a1a2e;
      color: #fff;
      border: 1px solid rgba(0, 212, 255, 0.5);
      padding: 0.4rem 0.6rem;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    .category-add button {
      background: #00d4ff;
      color: #1a1a2e;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .category-add button:hover { background: #00b8e6; }
    .category-error {
      color: #ff4444;
      font-size: 0.8rem;
      margin-top: 0.5rem;
      min-height: 1rem;
    }
    #status { font-size: 0.9rem; color: #888; margin-top: 2rem; }
    #status.is-controller { color: #00d4ff; }
    #error {
      position: fixed;
      top: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background-color: #ff4444;
      color: #ffffff;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-size: 0.9rem;
      box-shadow: 0 4px 12px rgba(255, 68, 68, 0.3);
      z-index: 100;
      transition: opacity 0.3s;
    }
    #error.hidden { opacity: 0; pointer-events: none; }
    .hidden { display: none !important; }

    /* History Styles */
    #history-list { flex: 1; overflow-y: auto; }
    .history-item {
      background: rgba(0, 212, 255, 0.05);
      border-left: 4px solid #00d4ff;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 6px;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s;
    }
    .history-item:hover { background: rgba(0, 212, 255, 0.1); }
    .history-info { display: flex; flex-direction: column; gap: 0.3rem; }
    .history-date { font-size: 0.85rem; color: #aaa; }
    .history-duration { font-size: 1.25rem; font-weight: 500; color: #fff; }
    .history-food {
      margin-top: 0.2rem;
    }
    .history-food select {
      background: #1a1a2e;
      color: #fff;
      border: 1px solid rgba(0, 212, 255, 0.5);
      padding: 0.4rem 0.6rem;
      border-radius: 4px;
      font-size: 0.85rem;
      outline: none;
      font-weight: 400;
    }
    .history-delete {
      background: transparent;
      border: none;
      color: #ff4444;
      font-size: 1.5rem;
      cursor: pointer;
      opacity: 0.5;
      transition: opacity 0.2s, transform 0.1s;
      padding: 0.5rem;
    }
    .history-delete:hover { opacity: 1; transform: scale(1.1); }
    .history-empty { text-align: center; color: #666; font-style: italic; margin-top: 2rem; }
    .chart-container { margin-bottom: 2rem; position: relative; height: 250px; width: 100%; }
  </style>
</head>
<body>
  <div id="error" class="hidden">Verbindung unterbrochen</div>
  <div class="layout-grid">
    <!-- Left Sidebar: Total Time & History -->
    <div class="sidebar left" id="history-sidebar">
      <div class="total-time-container">
        <div id="timer">00:00.00</div>
        <div class="timer-label">Min : Sek . Ms</div>
        <div id="timer-hours" style="font-size: 1rem; color: #aaa; margin-top: 0.4rem;">0 Std 0 Min</div>
      </div>
      <h2>Historie</h2>
      <div id="history-list">
        <div class="history-empty">Lade Historie...</div>
      </div>
    </div>

    <!-- Main Content: Timers & Controls -->
    <div class="main">
      <div id="session-wrapper">
        <div id="session-timer">00:00.00</div>
        <div class="session-timer-label">Aktuelle Session</div>
      </div>

      <div class="controls">
        <button id="control-btn" disabled>Start</button>
        <button id="cancel-btn" class="hidden">Abbrechen</button>
      </div>
      
      <div class="food-selector-container">
        <div class="food-selector-row">
          <label for="food-select">Essen:</label>
          <select id="food-select">
            <option value="Unbekannt">-- Bitte wählen --</option>
          </select>
          <button class="category-toggle-btn" onclick="toggleCategoryManager()">Kategorien verwalten</button>
        </div>
        <div id="category-manager" class="category-manager">
          <h3>Kategorien</h3>
          <ul id="category-list" class="category-list"></ul>
          <div class="category-add">
            <input type="text" id="new-category-input" placeholder="Neue Kategorie..." maxlength="50">
            <button onclick="addCategory()">Hinzufügen</button>
          </div>
          <div id="category-error" class="category-error"></div>
        </div>
      </div>

      <div id="status">Verbinde...</div>
    </div>

    <!-- Right Sidebar: Statistics -->
    <div class="sidebar right" id="stats-sidebar">
      <h2>Statistiken</h2>
      <div class="chart-container"><canvas id="avgChart"></canvas></div>
      <div class="chart-container">
        <button id="tod-toggle" onclick="toggleTodMode()" style="position:absolute;top:0;right:0;z-index:10;background:rgba(0,212,255,0.15);border:1px solid rgba(0,212,255,0.4);color:#00d4ff;padding:0.3rem 0.6rem;border-radius:4px;font-size:0.7rem;cursor:pointer;">Anzahl / Dauer</button>
        <canvas id="todChart"></canvas>
      </div>
      <div class="chart-container"><canvas id="foodChart"></canvas></div>
      <div class="chart-container"><canvas id="daysChart"></canvas></div>
      <div class="chart-container"><canvas id="trendChart"></canvas></div>
    </div>
  </div>
  <script>
    // --- UTILS ---
    function generateUUID() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0;
        const v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      const milliseconds = Math.floor((ms % 1000) / 10);
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(milliseconds).padStart(2, '0')}`;
    }

    // --- STATE ---
    const clientId = generateUUID();
    let state = {
      running: false,
      startTime: null,
      elapsed: 0,
      isController: false,
      sessions: [],
      categories: []
    };
    let isFetching = false;
    let charts = {};
    window.todMode = 'count'; // 'count' or 'duration'

    function toggleTodMode() {
      window.todMode = window.todMode === 'count' ? 'duration' : 'count';
      renderCharts();
    }

    // --- DOM ELEMENTS ---
    const timerEl = document.getElementById('timer');
    const timerHoursEl = document.getElementById('timer-hours');
    const sessionTimerEl = document.getElementById('session-timer');
    const controlBtn = document.getElementById('control-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');
    const historyListEl = document.getElementById('history-list');
    const foodSelectEl = document.getElementById('food-select');
    const categoryManagerEl = document.getElementById('category-manager');
    const categoryListEl = document.getElementById('category-list');
    const newCategoryInput = document.getElementById('new-category-input');
    const categoryErrorEl = document.getElementById('category-error');

    Chart.defaults.color = '#888';
    Chart.defaults.font.family = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
    // --- CATEGORY MANAGEMENT ---
    function toggleCategoryManager() {
      categoryManagerEl.classList.toggle('visible');
    }

    function renderCategories() {
      // Update dropdown
      const currentVal = foodSelectEl.value;
      foodSelectEl.innerHTML = '<option value="Unbekannt">-- Bitte wählen --</option>';
      state.categories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        foodSelectEl.appendChild(opt);
      });
      if (state.categories.includes(currentVal)) {
        foodSelectEl.value = currentVal;
      }

      // Update category list in manager
      categoryListEl.innerHTML = '';
      state.categories.forEach(cat => {
        const li = document.createElement('li');
        li.className = 'category-item';
        li.innerHTML = `
          <span>${cat}</span>
          <button class="cat-btn edit" onclick="startEditCategory('${cat.replace(/'/g, "\\'")}')" title="Bearbeiten">✏️</button>
          <button class="cat-btn delete" onclick="deleteCategory('${cat.replace(/'/g, "\\'")}')" title="Löschen">🗑️</button>
        `;
        categoryListEl.appendChild(li);
      });
    }

    function startEditCategory(oldName) {
      const items = categoryListEl.querySelectorAll('.category-item');
      items.forEach(item => {
        const span = item.querySelector('span');
        if (span && span.textContent === oldName) {
          item.innerHTML = `
            <input type="text" value="${oldName}" maxlength="50" id="edit-cat-input">
            <button class="cat-btn save" onclick="saveEditCategory('${oldName.replace(/'/g, "\\'")}')">✓</button>
            <button class="cat-btn delete" onclick="renderCategories()">✕</button>
          `;
          item.querySelector('input').focus();
          item.querySelector('input').addEventListener('keydown', e => {
            if (e.key === 'Enter') saveEditCategory(oldName);
            if (e.key === 'Escape') renderCategories();
          });
        }
      });
    }

    async function saveEditCategory(oldName) {
      const input = document.getElementById('edit-cat-input');
      if (!input) return;
      const newName = input.value.trim();
      if (!newName) { showCategoryError('Name darf nicht leer sein'); return; }
      if (newName === oldName) { renderCategories(); return; }

      try {
        const res = await fetch('/api/control', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ clientId, action: 'rename_category', oldName, newName })
        });
        const data = await res.json();
        if (!res.ok || !data.success) {
          showCategoryError(data.error || 'Fehler beim Umbenennen');
          return;
        }
        state.categories = data.categories || state.categories;
        if (data.state) state.sessions = data.state.sessions || state.sessions;
        renderCategories();
        renderHistory();
        showCategoryError('');
      } catch (e) {
        showCategoryError('Verbindungsfehler');
      }
    }

    async function addCategory() {
      const name = newCategoryInput.value.trim();
      if (!name) { showCategoryError('Name darf nicht leer sein'); return; }

      try {
        const res = await fetch('/api/control', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ clientId, action: 'add_category', categoryName: name })
        });
        const data = await res.json();
        if (!res.ok || !data.success) {
          showCategoryError(data.error || 'Fehler beim Erstellen');
          return;
        }
        state.categories = data.categories || state.categories;
        newCategoryInput.value = '';
        renderCategories();
        showCategoryError('');
      } catch (e) {
        showCategoryError('Verbindungsfehler');
      }
    }

    async function deleteCategory(name) {
      if (!confirm(`Kategorie "${name}" wirklich löschen?`)) return;
      try {
        const res = await fetch('/api/control', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ clientId, action: 'delete_category', categoryName: name })
        });
        const data = await res.json();
        if (!res.ok || !data.success) {
          showCategoryError(data.error || 'Fehler beim Löschen');
          return;
        }
        state.categories = data.categories || state.categories;
        renderCategories();
        showCategoryError('');
      } catch (e) {
        showCategoryError('Verbindungsfehler');
      }
    }

    function showCategoryError(msg) {
      categoryErrorEl.textContent = msg;
    }

    newCategoryInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') addCategory();
    });
    // --- RENDER FUNCTIONS ---
    function updateDisplay() {
      if (state.running && state.startTime) {
        const now = Date.now();
        const currentSessionTime = now - state.startTime;
        sessionTimerEl.textContent = formatTime(currentSessionTime);
      }
      requestAnimationFrame(updateDisplay);
    }

    function showError() { errorEl.classList.remove('hidden'); }
    function hideError() { errorEl.classList.add('hidden'); }

    function updateUI() {
      controlBtn.disabled = isFetching;
      cancelBtn.disabled = isFetching;
      controlBtn.textContent = state.running ? 'Stop' : 'Start';
      foodSelectEl.disabled = isFetching;

      timerEl.textContent = formatTime(state.elapsed);
      const totalMinutes = Math.floor(state.elapsed / 60000);
      const hours = Math.floor(totalMinutes / 60);
      const mins = totalMinutes % 60;
      timerHoursEl.textContent = `${hours} Std ${mins} Min`;

      if (state.running) {
        cancelBtn.classList.remove('hidden');
      } else {
        sessionTimerEl.textContent = formatTime(0);
        cancelBtn.classList.add('hidden');
      }

      statusEl.textContent = 'Verbunden';
      statusEl.classList.add('is-controller');

      renderCategories();
      renderHistory();
      renderCharts();
    }

    function renderHistory() {
      if (!state.sessions || state.sessions.length === 0) {
        historyListEl.innerHTML = '<div class="history-empty">Noch keine Einträge.</div>';
        return;
      }

      const sorted = [...state.sessions].sort((a, b) => b.start - a.start);

      historyListEl.innerHTML = sorted.map(s => {
        const d = new Date(s.start);
        const longDateStr = d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        const foodVal = s.food || 'Unbekannt';

        // Build food select options for this session
        let foodOptions = '<option value="Unbekannt"' + (foodVal === 'Unbekannt' ? ' selected' : '') + '>-- Keine --</option>';
        state.categories.forEach(cat => {
          foodOptions += `<option value="${cat}"${cat === foodVal ? ' selected' : ''}>${cat}</option>`;
        });

        return `
          <div class="history-item">
            <div class="history-info">
              <div class="history-date">${longDateStr}</div>
              <div class="history-duration">${formatTime(s.duration)}</div>
              <div class="history-food">
                <select onchange="updateSessionFood('${s.id}', this.value)">${foodOptions}</select>
              </div>
            </div>
            <button class="history-delete" onclick="handleAction('delete_session', '${s.id}')" title="Löschen">✕</button>
          </div>
        `;
      }).join('');
    }

    async function updateSessionFood(sessionId, food) {
      try {
        const res = await fetch('/api/control', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ clientId, action: 'update_session_food', sessionId, food })
        });
        const data = await res.json();
        if (res.ok && data.success && data.state) {
          state.sessions = data.state.sessions || state.sessions;
          renderCharts();
        }
      } catch (e) {
        showError();
      }
    }
    function initOrUpdateChart(id, type, data, options) {
      const ctx = document.getElementById(id).getContext('2d');
      if (charts[id]) {
        charts[id].data = data;
        charts[id].options = options;
        charts[id].update();
      } else {
        charts[id] = new Chart(ctx, { type, data, options });
      }
    }

    function renderCharts() {
      if (!state.sessions) return;
      const sessions = state.sessions;

      // 1. Avg Time & Count - with values in bars
      const count = sessions.length;
      const totalTime = sessions.reduce((acc, s) => acc + s.duration, 0);
      const avgTime = count > 0 ? totalTime / count : 0;

      initOrUpdateChart('avgChart', 'bar', {
        labels: ['Gesamtanzahl', 'Ø Dauer (Min)'],
        datasets: [{
          label: 'Allgemein',
          data: [count, +(avgTime / 60000).toFixed(1)],
          backgroundColor: ['#00d4ff', '#ffaa00'],
          borderRadius: 4
        }]
      }, {
        responsive: true, maintainAspectRatio: false,
        plugins: { title: { display: true, text: 'Übersicht', color: '#fff' }, legend: { display: false } }
      });

      // Draw values on avgChart bars
      if (charts['avgChart']) {
        charts['avgChart'].options.animation = {
          onComplete: function() {
            const chart = charts['avgChart'];
            const ctx = chart.ctx;
            ctx.save();
            ctx.font = 'bold 13px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#fff';
            const meta = chart.getDatasetMeta(0);
            meta.data.forEach((bar, index) => {
              const val = chart.data.datasets[0].data[index];
              const barHeight = bar.base - bar.y;
              if (barHeight > 18) {
                ctx.fillText(val, bar.x, bar.y + barHeight / 2);
              } else {
                ctx.fillText(val, bar.x, bar.y - 12);
              }
            });
            ctx.restore();
          }
        };
        charts['avgChart'].update();
      }

      // 2. Time of Day - doughnut with toggle (count / duration)
      const timeBlocks = {
        '6-8': { count: 0, duration: 0 }, '8-10': { count: 0, duration: 0 },
        '10-12': { count: 0, duration: 0 }, '12-14': { count: 0, duration: 0 },
        '14-16': { count: 0, duration: 0 }, '16-18': { count: 0, duration: 0 },
        '18-20': { count: 0, duration: 0 }, '20-22': { count: 0, duration: 0 },
        '22-6': { count: 0, duration: 0 }
      };
      sessions.forEach(s => {
        const hour = new Date(s.start).getHours();
        let key;
        if (hour >= 6 && hour < 8) key = '6-8';
        else if (hour >= 8 && hour < 10) key = '8-10';
        else if (hour >= 10 && hour < 12) key = '10-12';
        else if (hour >= 12 && hour < 14) key = '12-14';
        else if (hour >= 14 && hour < 16) key = '14-16';
        else if (hour >= 16 && hour < 18) key = '16-18';
        else if (hour >= 18 && hour < 20) key = '18-20';
        else if (hour >= 20 && hour < 22) key = '20-22';
        else key = '22-6';
        timeBlocks[key].count++;
        timeBlocks[key].duration += s.duration;
      });

      const todAllKeys = Object.keys(timeBlocks).filter(k => timeBlocks[k].count > 0);
      const todColors = ['#4a9eff', '#00d4ff', '#00e6a0', '#88ff00', '#ffdd00', '#ffaa00', '#ff6b6b', '#ff4488', '#9944ff'];
      const showDuration = window.todMode === 'duration';

      const todData = todAllKeys.map(k => showDuration ? +(timeBlocks[k].duration / 60000).toFixed(1) : timeBlocks[k].count);
      const todChartLabels = todAllKeys.map((k, i) => {
        const val = todData[i];
        return k + ' Uhr (' + (showDuration ? val + ' Min' : val + 'x') + ')';
      });

      initOrUpdateChart('todChart', 'doughnut', {
        labels: todChartLabels,
        datasets: [{ data: todData, backgroundColor: todColors.slice(0, todAllKeys.length), borderWidth: 0 }]
      }, {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          title: { display: true, text: showDuration ? 'Dauer nach Tageszeit' : 'Sessions nach Tageszeit', color: '#fff' },
          legend: { position: 'bottom', labels: { color: '#ccc', font: { size: 11 } } }
        }
      });

      // 3. Food Chart - with values inside bars
      let foodStats = {};
      sessions.forEach(s => {
        const food = (s.food && s.food !== 'Unbekannt') ? s.food : 'Keine Angabe';
        if (!foodStats[food]) foodStats[food] = { count: 0, duration: 0 };
        foodStats[food].count++;
        foodStats[food].duration += s.duration;
      });

      const foodLabels = Object.keys(foodStats);
      const foodAvgDurations = foodLabels.map(f => (foodStats[f].duration / foodStats[f].count) / 60000);
      const foodCounts = foodLabels.map(f => foodStats[f].count);

      initOrUpdateChart('foodChart', 'bar', {
        labels: foodLabels,
        datasets: [
          { label: 'Ø Dauer (Min)', data: foodAvgDurations, backgroundColor: 'rgba(255, 170, 0, 0.8)', borderRadius: 4, yAxisID: 'y' },
          { label: 'Anzahl', data: foodCounts, backgroundColor: '#00d4ff', borderRadius: 4, yAxisID: 'y1' }
        ]
      }, {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          title: { display: true, text: 'Nach Essen', color: '#fff' },
          datalabels: false
        },
        scales: {
          y: { type: 'linear', display: true, position: 'left', grid: { color: 'rgba(255,255,255,0.05)' }, title: { display: true, text: 'Ø Min', color: '#ffaa00' } },
          y1: { type: 'linear', display: true, position: 'right', grid: { drawOnChartArea: false }, ticks: { stepSize: 1 }, title: { display: true, text: 'Anzahl', color: '#00d4ff' } }
        }
      });

      // Draw values on food chart bars after render
      if (charts['foodChart']) {
        const foodChartInstance = charts['foodChart'];
        const origAfterDraw = foodChartInstance.options.animation && foodChartInstance.options.animation.onComplete;
        foodChartInstance.options.animation = {
          onComplete: function() {
            const ctx = foodChartInstance.ctx;
            ctx.save();
            ctx.font = 'bold 11px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            foodChartInstance.data.datasets.forEach((dataset, i) => {
              const meta = foodChartInstance.getDatasetMeta(i);
              meta.data.forEach((bar, index) => {
                const val = dataset.data[index];
                const displayVal = i === 0 ? val.toFixed(1) : val;
                ctx.fillStyle = i === 0 ? '#fff' : '#fff';
                const barHeight = bar.base - bar.y;
                if (barHeight > 16) {
                  ctx.fillText(displayVal, bar.x, bar.y + barHeight / 2);
                } else {
                  ctx.fillText(displayVal, bar.x, bar.y - 10);
                }
              });
            });
            ctx.restore();
          }
        };
        foodChartInstance.update();
      }
      // 4. Days Chart - clearer: bars for count, clear labels
      const daysMap = {};
      sessions.forEach(s => {
        const d = new Date(s.start).toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
        if (!daysMap[d]) daysMap[d] = { count: 0, duration: 0 };
        daysMap[d].count++;
        daysMap[d].duration += s.duration;
      });
      const dayLabels = Object.keys(daysMap);
      const dayCounts = dayLabels.map(d => daysMap[d].count);
      const dayAvgDurations = dayLabels.map(d => (daysMap[d].duration / daysMap[d].count) / 60000);

      initOrUpdateChart('daysChart', 'bar', {
        labels: dayLabels,
        datasets: [
          { label: 'Anzahl Sessions', data: dayCounts, backgroundColor: '#00d4ff', borderRadius: 4 }
        ]
      }, {
        responsive: true, maintainAspectRatio: false,
        plugins: { title: { display: true, text: 'Sessions pro Tag', color: '#fff' }, legend: { display: false } },
        scales: {
          x: { grid: { display: false }, ticks: { color: '#888', maxRotation: 45 } },
          y: { beginAtZero: true, ticks: { stepSize: 1, color: '#888' }, grid: { color: 'rgba(255,255,255,0.05)' } }
        }
      });

      // 5. Avg Duration per Day Trend (replaces cumulative trend)
      const avgDayMap = {};
      sessions.forEach(s => {
        const d = new Date(s.start).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
        if (!avgDayMap[d]) avgDayMap[d] = { total: 0, count: 0 };
        avgDayMap[d].total += s.duration;
        avgDayMap[d].count++;
      });
      const avgDayLabels = Object.keys(avgDayMap);
      const avgDayValues = avgDayLabels.map(d => (avgDayMap[d].total / avgDayMap[d].count) / 60000);

      initOrUpdateChart('trendChart', 'line', {
        labels: avgDayLabels,
        datasets: [{
          label: 'Ø Dauer (Min)',
          data: avgDayValues,
          borderColor: '#00d4ff',
          backgroundColor: 'rgba(0, 212, 255, 0.1)',
          fill: true,
          tension: 0.3,
          pointBackgroundColor: '#00d4ff',
          pointRadius: 4
        }]
      }, {
        responsive: true, maintainAspectRatio: false,
        plugins: { title: { display: true, text: 'Ø Dauer pro Tag', color: '#fff' }, legend: { display: false } },
        scales: {
          x: { ticks: { maxTicksLimit: 7, color: '#888' }, grid: { display: false } },
          y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, title: { display: true, text: 'Minuten', color: '#888' } }
        }
      });
    }
    // --- API POLLING & ACTIONS ---
    async function pollState() {
      if (isFetching) return;
      try {
        const response = await fetch(`/api/state?clientId=${clientId}`);
        if (!response.ok) throw new Error('Server error');
        const data = await response.json();

        const stateChanged = state.running !== data.running ||
                             state.elapsed !== data.elapsed ||
                             state.isController !== data.isController ||
                             JSON.stringify(state.sessions) !== JSON.stringify(data.sessions) ||
                             JSON.stringify(state.categories) !== JSON.stringify(data.categories);

        state.running = data.running;
        state.startTime = data.startTime;
        state.elapsed = data.elapsed;
        state.isController = data.isController;
        state.sessions = data.sessions || [];
        state.categories = data.categories || [];

        if (stateChanged) {
          updateUI();
        }
        hideError();
      } catch (error) {
        showError();
      }
    }

    async function handleAction(action, targetSessionId = null) {
      if (isFetching) return;

      if (action === 'delete_session') {
        if (!confirm('Möchtest du diesen Eintrag wirklich aus dem Verlauf löschen?')) return;
      }

      isFetching = true;
      if (action === 'start') {
        state.running = true;
        state.startTime = Date.now();
      } else if (action === 'stop' || action === 'cancel') {
        state.running = false;
      }
      updateUI();

      try {
        const payload = { clientId, action };
        if (targetSessionId) payload.sessionId = targetSessionId;
        // Send selected food when stopping
        if (action === 'stop') {
          payload.food = foodSelectEl.value;
        }

        const response = await fetch('/api/control', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          const data = await response.json();
          if (data.success && data.state) {
            state.running = data.state.running;
            state.startTime = data.state.startTime;
            state.elapsed = data.state.elapsed;
            state.sessions = data.state.sessions || [];
          }
          if (data.categories) {
            state.categories = data.categories;
          }
        }
      } catch (error) {
        showError();
      } finally {
        isFetching = false;
        updateUI();
      }
    }

    controlBtn.addEventListener('click', () => handleAction(state.running ? 'stop' : 'start'));
    cancelBtn.addEventListener('click', () => {
      if (confirm('Aktuelle Session wirklich abbrechen? Diese Zeit wird nicht gespeichert.')) {
        handleAction('cancel');
      }
    });

    // --- INIT ---
    pollState();
    setInterval(pollState, 500);
    requestAnimationFrame(updateDisplay);
  </script>
</body>
</html>
